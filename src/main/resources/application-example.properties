# Copy this file to application.properties, then fill in only local values.
# application.properties is intentionally excluded from Git.

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/project302?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=
spring.datasource.password=

# JWT
jwt.issuer=project302
jwt.secret-key=
jwt.duration=3600000
jwt.refresh-duration=1209600000

# AWS
cloud.aws.credentials.accessKey=
cloud.aws.credentials.secretKey=
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.bucket=
application.amazon.sqs.queue-name=

# File upload
file.dir=

# University verification
univcert.api.key=

